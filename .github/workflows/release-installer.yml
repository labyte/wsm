name: release-installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      app_version:
        description: "Installer version (optional, e.g. 1.2.3)"
        required: false
        type: string

jobs:
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build installer package
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.app_version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            ./scripts/build-installer.ps1 -Configuration Release
          } else {
            ./scripts/build-installer.ps1 -Configuration Release -AppVersion $version
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WSM-Installer
          path: installer/Output/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe
          generate_release_notes: true
          append_body: true
          body: |
            Automated installer package built by GitHub Actions.
